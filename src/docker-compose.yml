# ===========================================================================
# Shaarli for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : shaarli/shaarli:v0.16.11 (Docker Hub, used unmodified)
#                  -> https://github.com/shaarli/Shaarli
#
# Ports   : host 8176 -> container 8080. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all writable paths live below
#           /Volume1/DockerAppData/shaarlidocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
#           Shaarli keeps its data in /var/www/shaarli/data (config, datastore,
#           history, update-check file), downloaded thumbnails in
#           /var/www/shaarli/cache, rendered pages in /var/www/shaarli/pagecache
#           and compiled templates in /var/www/shaarli/tmp. All four must be
#           writable by uid 1000; the image ships them owned by its nginx user.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the image runs nginx + php-fpm on port 80 as its own nginx user,
#           which uid 1000 cannot bind or write. The wrapper checks the four
#           writable directories and runs the built-in PHP web server on port
#           8080 with a router that sends /install, /login, /admin and
#           /shaare/... to index.php (Shaarli is a Slim application) while
#           still denying data/cache/template/vendor paths.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  shaarlidocker:
    image: shaarli/shaarli:v0.16.11
    container_name: shaarlidocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    ports:
      - "8176:8080"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/shaarlidocker/data:/var/www/shaarli/data
      - /Volume1/DockerAppData/shaarlidocker/cache:/var/www/shaarli/cache
      - /Volume1/DockerAppData/shaarlidocker/pagecache:/var/www/shaarli/pagecache
      - /Volume1/DockerAppData/shaarlidocker/tmp:/var/www/shaarli/tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/tpl/default/css/shaarli.min.css || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8176
    protocol: http
